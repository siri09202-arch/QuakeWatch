<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuakeWatch - リアルタイム地震・津波ビューアー</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 左側パネル：地震履歴・震度情報 -->
        <div class="left-panel">
            <div class="panel-header">
                <h2>地震・津波情報</h2>
                <button id="refreshBtn" class="refresh-btn">更新</button>
            </div>
            
            <div class="earthquake-info">
                <div class="info-section">
                    <h3>最新地震情報</h3>
                    <div id="latestInfo" class="latest-info">
                        <p class="loading">データを読み込み中...</p>
                    </div>
                </div>

                <div class="info-section">
                    <h3>地震履歴</h3>
                    <div id="historyList" class="history-list">
                        <p class="loading">データを読み込み中...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右側パネル：地図 -->
        <div class="right-panel">
            <div id="map" class="map-container"></div>
            <div id="mapLegend" class="map-legend">
                <h4>震度レベル</h4>
                <div class="legend-item">
                    <span class="legend-dot" style="background-color: #0000ff;"></span>
                    <span>0 - 1</span>
                </div>
                <div class="legend-item">
                    <span class="legend-dot" style="background-color: #00ffff;"></span>
                    <span>2 - 3</span>
                </div>
                <div class="legend-item">
                    <span class="legend-dot" style="background-color: #00ff00;"></span>
                    <span>4</span>
                </div>
                <div class="legend-item">
                    <span class="legend-dot" style="background-color: #ffff00;"></span>
                    <span>5弱</span>
                </div>
                <div class="legend-item">
                    <span class="legend-dot" style="background-color: #ff7f00;"></span>
                    <span>5強</span>
                </div>
                <div class="legend-item">
                    <span class="legend-dot" style="background-color: #ff0000;"></span>
                    <span>6+</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
